name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            # 自動審査はソースから npm run build をやり直して配布物と比べる。
            # 同じコミットから同じ main.js が出ることを確かめる。
            - name: Check that the build is reproducible
              run: |
                  sha256sum main.js > "$RUNNER_TEMP/main.js.sha256"
                  npm run build
                  sha256sum --check "$RUNNER_TEMP/main.js.sha256"

            # build がリポジトリ内に余計なファイルを作っていないこと（main.js は .gitignore 済み）
            - name: Check that the build has no side effects
              run: |
                  git status --porcelain
                  test -z "$(git status --porcelain)"

            - name: Test
              run: npm test --if-present
